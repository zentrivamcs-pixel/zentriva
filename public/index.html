<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#131b2e" />
    <!-- This file is the TEMPLATE for every page. After the build,
         scripts/build-seo.js rewrites the title, description, canonical, and
         og:/twitter: values below into one static file per public route
         (build/register.html, build/contact.html, …) so each URL a crawler
         fetches carries its own metadata instead of the SPA's shared shell.
         Change copy in src/shared/seo.json, not here. -->
    <meta
      name="description"
      content="A member-driven multipurpose cooperative in Nigeria offering practical skills training, mentorship, and pooled resources for young people and professionals."
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Zentriva Multipurpose Cooperative Society" />
    <link rel="canonical" href="https://zentrivacoop.com/" />
    <!-- Social sharing (Open Graph / Twitter) — og-image.png is the logo
         centered on a 1200x630 canvas, the standard link-preview ratio.
         These URLs must be ABSOLUTE: Facebook, WhatsApp, LinkedIn and X all
         drop a relative og:image, which is why previews showed no picture. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Zentriva Multipurpose Cooperative Society" />
    <meta property="og:locale" content="en_NG" />
    <meta property="og:url" content="https://zentrivacoop.com/" />
    <meta property="og:title" content="Zentriva Multipurpose Cooperative Society | Skills Training" />
    <meta property="og:description" content="Skilled. Empowered. Rooted in Purpose. Join a member-driven cooperative offering training, mentorship, and real economic opportunity." />
    <meta property="og:image" content="https://zentrivacoop.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Zentriva Multipurpose Cooperative Society" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zentriva Multipurpose Cooperative Society | Skills Training" />
    <meta name="twitter:description" content="Skilled. Empowered. Rooted in Purpose. Join a member-driven cooperative offering training, mentorship, and real economic opportunity." />
    <meta name="twitter:image" content="https://zentrivacoop.com/og-image.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/logo192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="%PUBLIC_URL%/logo512.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!-- The homepage's largest paint is the hero, whose backdrop is a CSS
         background — the browser can't discover it until the stylesheet is
         parsed. Preloading it pulls the LCP in, which is a ranking signal. -->
    <link rel="preload" as="image" href="%PUBLIC_URL%/images/hero-bg.jpg" fetchpriority="high" />
    <!-- Fonts used by the member portal (src/member) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <!-- Paystack's inline.js is injected on demand by the registration form -->
    <style>
      /* Material Symbols render their ligature names as text until the font
         loads — hide icon text until then instead of flashing raw words. */
      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined', sans-serif;
        visibility: visible;
      }
    </style>
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Zentriva Multipurpose Cooperative Society | Skills Training</title>
  </head>
  <body>
    <!-- Crawlers that don't execute JavaScript (and visitors with it off)
         get a short, accurate summary of the same content the app renders —
         a heading, what the cooperative is, and real links. -->
    <noscript>
      <h1>Zentriva Multipurpose Cooperative Society</h1>
      <p>
        Zentriva Multipurpose Cooperative Society Limited is a member-driven cooperative in
        Nigeria dedicated to skills training, mentorship, and empowerment. We equip young
        people and aspiring professionals with practical, market-relevant skills in business,
        technology, and creative fields, and pool resources to support member ventures.
      </p>
      <p>
        <a href="/register">Join Zentriva</a> ·
        <a href="/contact">Contact us</a> ·
        <a href="/privacy">Privacy Policy</a> ·
        <a href="/terms">Terms of Service</a>
      </p>
      <p>This site needs JavaScript enabled for membership registration and the member portal.</p>
    </noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
